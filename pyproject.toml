[project]
name = "stock-material-detection"
version = "0.1.0"
description = "Stock material counts from one photo (YOLOE boxes + SigLIP 2 gallery match) CLI and HTTP API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Ultralytics text_model imports `clip` for YOLOE / YOLO-World prompts.
    "clip",
    "fastapi>=0.115",
    "numpy>=1.26",
    "pillow>=11",
    "pydantic>=2.9",
    "python-multipart>=0.0.12",
    "torch>=2.4",
    "transformers>=4.49",
    "typer>=0.12",
    "ultralytics>=8.3.150",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
ocr = [
    "paddleocr>=3",
    "paddlepaddle>=3",
]

[project.scripts]
stock-material-detection = "stock_material_detection.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stock_material_detection"]

[tool.uv.sources]
clip = { git = "https://github.com/ultralytics/CLIP.git" }

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
